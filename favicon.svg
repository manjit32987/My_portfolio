<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6db349"/>
            <stop offset="50%" stop-color="#7ecc53"/>
            <stop offset="100%" stop-color="#8ed867"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6db349" flood-opacity="0.6"/>
        </filter>
    </defs>
    <!-- Background rounded squircle -->
    <rect x="2" y="2" width="60" height="60" rx="16" fill="#0b0c10" stroke="#262a36" stroke-width="2"/>
    
    <!-- Micro Circuit traces -->
    <path d="M8 32h10M46 32h10M32 8v10M32 46v10" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="18" cy="32" r="2.5" fill="#38bdf8"/>
    <circle cx="46" cy="32" r="2.5" fill="#38bdf8"/>
    <circle cx="32" cy="18" r="2.5" fill="#8ed867"/>
    <circle cx="32" cy="46" r="2.5" fill="#6db349"/>

    <!-- Central Tech Hexagon -->
    <polygon points="32,16 46,24 46,40 32,48 18,40 18,24" fill="none" stroke="url(#favGrad)" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Monogram 'MC' -->
    <text x="32" y="36.5" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">MC</text>
</svg>
